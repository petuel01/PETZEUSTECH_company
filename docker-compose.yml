services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: petzeustech-web
    restart: unless-stopped
    ports:
      - "80:80"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
