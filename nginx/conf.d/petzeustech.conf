# ========================================================
# Nginx Virtual Host Configuration for petzeustech.com
# ========================================================

# Upstream Node.js application container
upstream petzeustech_backend {
    server app:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# 1. HTTP Server - ACME Challenge & SSL Redirect
server {
    listen 80;
    listen [::]:80;
    server_name petzeustech.com www.petzeustech.com;

    # Let's Encrypt Certbot challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://petzeustech.com$request_uri;
    }
}

# 2. HTTPS Server - Secure Production Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name petzeustech.com www.petzeustech.com;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/petzeustech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/petzeustech.com/privkey.pem;

    # Modern TLS Security Protocols
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Hardened Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Maximum payload size (for document and asset attachments)
    client_max_body_size 50M;

    # Static Assets Caching (Vite build outputs with hashed filenames)
    location /assets/ {
        proxy_pass http://petzeustech_backend;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    # Let's Encrypt renewal in SSL mode
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Health check passthrough
    location /api/health {
        proxy_pass http://petzeustech_backend/api/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # All API and Frontend Traffic
    location / {
        proxy_pass http://petzeustech_backend;
        proxy_http_version 1.1;

        # WebSocket & HTTP/1.1 Upgrades
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Real Client IP and Host forwarding
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts for responsive communication
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Disable buffering for low-latency streaming
        proxy_buffering off;
    }
}
