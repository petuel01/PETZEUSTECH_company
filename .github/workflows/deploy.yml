name: PETZEUSTECH Continuous Deployment

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    name: Build, Lint & Deploy Frontend
    runs-on: ubuntu-latest
    env:
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Run TypeScript & Linting Checks
        run: npm run lint

      - name: Compile Production Build
        run: npm run build

      - name: Deploy to VPS via SSH
        if: ${{ env.VPS_PASSWORD != '' || env.VPS_SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || '162.35.183.158' }}
          username: ${{ secrets.VPS_USER || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /opt/petzeustech
            ./deploy.sh

      - name: Post-Build Notice
        if: ${{ env.VPS_PASSWORD == '' && env.VPS_SSH_KEY == '' }}
        run: |
          echo "================================================================"
          echo " Build and Lint tests PASSED successfully!"
          echo " To enable automatic deployment to 162.35.183.158:"
          echo " Go to GitHub > Settings > Secrets and variables > Actions"
          echo " Add secret: VPS_PASSWORD (value: your VPS password)"
          echo "================================================================"
