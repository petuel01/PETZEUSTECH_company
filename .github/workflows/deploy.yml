name: PETZEUSTECH Automated Continuous Deployment

on:
  push:
    branches:
      - main

jobs:
  test_and_deploy:
    name: Build, Lint & Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript & Linting Checks
        run: npm run lint

      - name: Verify Build
        run: npm run build

      - name: Deploy to VPS via SSH
        if: success() && secrets.VPS_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /opt/petzeustech
            ./deploy.sh
